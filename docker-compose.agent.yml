version: '3.8'

services:
  shipwright-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile.runtime
    image: shipwright-agent:latest
    container_name: shipwright-agent
    restart: unless-stopped

    # Mount Docker socket to control containers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - shipwright-data:/var/lib/shipwright
      - shipwright-config:/etc/shipwright
      # Mount SSH keys for git operations (read-only)
      - ${HOME}/.ssh:/home/shipwright/.ssh:ro
      # Mount deployment directory
      - ${SHIPWRIGHT_DEPLOY_DIR:-/home/${USER}/apps}:/apps
      # Mount shipwright repo for self-updates
      - ${HOME}/.shipwright/repo:/home/shipwright/.shipwright/repo
      # Mount cargo for self-update builds
      - ${HOME}/.cargo:/home/shipwright/.cargo:ro

    # Ports for WebSocket and HTTP webhooks
    ports:
      - "17671:17671"  # WebSocket
      - "17670:17670"  # HTTP Webhooks

    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - SHIPWRIGHT_WS_PORT=17671
      - SHIPWRIGHT_HTTP_PORT=17670
      - SHIPWRIGHT_DEPLOY_DIR=/apps
      - SHIPWRIGHT_REPO_PATH=/home/shipwright/.shipwright/repo
      - PATH=/home/shipwright/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    # Connect to proxy network if it exists
    networks:
      - shipwright-internal
      - proxy-tier  # For webhook routing through reverse proxy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:17670/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    labels:
      - "com.shipwright.component=agent"
      - "com.shipwright.version=0.1.0"

networks:
  shipwright-internal:
    driver: bridge

  # Join existing proxy network
  proxy-tier:
    external: true
    # If proxy-tier doesn't exist, create it
    # Users can manually create: docker network create proxy-tier

volumes:
  shipwright-data:
    driver: local
  shipwright-config:
    driver: local
