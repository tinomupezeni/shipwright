name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: shipwright
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: shipwright
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: shipwright
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: shipwright.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p shipwright-cli

      - name: Build Agent
        run: cargo build --release --target ${{ matrix.target }} -p shipwright-agent

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../shipwright-${{ matrix.target }}.tar.gz shipwright-cli shipwright-agent
          cd ../../../

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../shipwright-${{ matrix.target }}.zip shipwright-cli.exe shipwright-agent.exe
          cd ../../../

      - name: Upload Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            shipwright-${{ matrix.target }}.tar.gz
            shipwright-${{ matrix.target }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
